<script id="duarte-v236-offline-login-guard">
(function(){
 function notice(){var box=document.getElementById('message');if(box){box.textContent="No internet connection. You can't log in while offline. Please reconnect and try again.";box.className='message show error';}}
 document.addEventListener('submit',function(ev){if(!navigator.onLine){ev.preventDefault();ev.stopImmediatePropagation();notice();}},true);
 document.addEventListener('DOMContentLoaded',function(){if(!navigator.onLine)notice();});
 window.addEventListener('offline',notice);

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://mrrothkiygcxspiwotjx.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_wYyisTscusEPgTmpbZGYmw_e_mTcAwW";

const supabaseClient = window.supabase?.createClient
    ? window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
        {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}
    ) : null;


const loginForm =
    document.getElementById("loginForm");

const loginButton =
    document.getElementById("loginButton");

const message =
    document.getElementById("message");

const passwordInput =
    document.getElementById("password");

const togglePassword =
    document.getElementById("togglePassword");


function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "message show " + type;

}


/* PASSWORD VISIBILITY */

togglePassword.addEventListener("click", function () {

    if (passwordInput.type === "password") {

        passwordInput.type = "text";
        togglePassword.textContent = "🙈";

    } else {

        passwordInput.type = "password";
        togglePassword.textContent = "👁";

    }

});


/* LOGIN */

loginForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const password =
        passwordInput.value;

    if (!email || !password) {

        showMessage(
            "Please enter your email and password.",
            "error"
        );

        return;
    }


    if (!navigator.onLine) {
        showMessage(
            "No internet connection. You can't log in while offline. Please reconnect and try again.",
            "error"
        );
        loginButton.disabled = false;
        loginButton.textContent = "LOGIN";
        return;
    }

    if (!supabaseClient) {
        showMessage("Login service unavailable. Connect to the internet and try again.", "error");
        return;
    }
    loginButton.disabled = true;
    loginButton.textContent = "SIGNING IN...";

    message.className = "message";


    try {

        const { data, error } =
            await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });


        if (error) {
            throw error;
        }


        if (!data.session) {

            throw new Error(
                "Login succeeded but no session was created."
            );

        }


        showMessage(
            "Login successful. Opening Duarte Clan...",
            "success"
        );


        setTimeout(function() {

            window.location.href = "index.html";

        }, 700);


    } catch(error) {

        console.error(error);

        showMessage(
            error.message ||
            "Unable to sign in. Please check your account.",
            "error"
        );

        loginButton.disabled = false;
        loginButton.textContent = "LOGIN";

    }

});


/* CREATE ACCOUNT */

document
.getElementById("createAccount")
.addEventListener("click", async function(event) {

    event.preventDefault();

    const email =
        prompt("Enter your email address:");

    if (!email) return;


    const password =
        prompt("Create a password (minimum 6 characters):");

    if (!password) return;


    if (password.length < 6) {

        showMessage(
            "Password must contain at least 6 characters.",
            "error"
        );

        return;

    }


    const fullName =
        prompt("Enter your full name:");

    if (!fullName) return;


    try {

        const { data, error } =
            await supabaseClient.auth.signUp({

                email: email,
                password: password,

                options: {
                    data: {
                        full_name: fullName
                    }
                }

            });


        if (error) {
            throw error;
        }


        showMessage(
            "Account created. Check your email if email confirmation is enabled.",
            "success"
        );


    } catch(error) {

        console.error(error);

        showMessage(
            error.message ||
            "Unable to create your account.",
            "error"
        );

    }

});


/* FORGOT PASSWORD */

document
.getElementById("forgotPassword")
.addEventListener("click", async function(event) {

    event.preventDefault();

    const email =
        prompt("Enter your Duarte Clan account email:");

    if (!email) return;


    try {

        const { error } =
            await supabaseClient.auth.resetPasswordForEmail(
                email,
                {
                    redirectTo:
                        window.location.origin +
                        "/reset-password.html"
                }
            );


        if (error) {
            throw error;
        }


        showMessage(
            "Password reset instructions have been sent to your email.",
            "success"
        );


    } catch(error) {

        console.error(error);

        showMessage(
            error.message ||
            "Unable to send password reset email.",
            "error"
        );

    }

});


/* Automatic return using Supabase persistent session, not saved plaintext credentials. */
(async function checkExistingSession() {
    const next = () => window.location.replace('index.html');
    try {
        const params = new URLSearchParams(window.location.search);
        if (params.get('offline') === '1' && !navigator.onLine) {
            showMessage("No internet connection. You can\'t log in while offline.", "error");
        }
    } catch(_) {}
    try {
        if (!navigator.onLine) {
            showMessage("No internet connection. You can\'t log in while offline.", "error");
            return;
        }
        if (!supabaseClient) return;
        const {data,error} = await supabaseClient.auth.getSession();
        if (navigator.onLine && !error && data?.session?.user) {
            showMessage('Welcome back · Opening Duarte Clan…', 'success');
            next();
        }
    } catch(e) {console.warn('Saved session check unavailable:',e);}
})();

</script>

(function(){
 const modal=document.getElementById("dcAuthModal"), form=document.getElementById("dcAuthForm"),

 let mode="signup";
 function close(){modal.classList.remove("open");modal.setAttribute("aria-hidden","true");form.reset();err.textContent=""}

   name.required=signup; pass.required=signup;
   modal.classList.add("open");modal.setAttribute("aria-hidden","false");setTimeout(()=>email.focus(),50);
 }
 function replaceLink(id,handler){
   const old=document.getElementById(id); if(!old)return;
   const fresh=old.cloneNode(true); old.replaceWith(fresh);
   fresh.addEventListener("click",e=>{e.preventDefault();handler()});
 }
 replaceLink("createAccount",()=>open("signup"));
 replaceLink("forgotPassword",()=>open("reset"));
 modal.querySelector(".dc-auth-cancel").onclick=close;
 modal.addEventListener("click",e=>{if(e.target===modal)close()});
 form.addEventListener("submit",async e=>{
   e.preventDefault();err.textContent="";
   const em=email.value.trim();
   try{
     if(mode==="signup"){
       if(!name.value.trim()){err.textContent="Enter your full name.";return}

       if(error)throw error;
       close(); if(typeof showMessage==="function")showMessage("Account created. Please check your email or wait for clan approval.","success");
     }else{

       close(); if(typeof showMessage==="function")showMessage("Password reset link sent. Please check your email.","success");
     }
   }catch(ex){err.textContent=ex?.message||"Unable to complete this request."}
 });
})();

<script id="duarte-signup-rate-limit-guard-v33n">
(function(){
  const RATE_KEY="duarte_signup_rate_limit_until_v33n";
  const COOLDOWN_MS=60*1000;

  function friendlySignupError(message){
    const m=String(message||"");
    if(/rate limit|too many requests|429/i.test(m)){
      return "Too many signup attempts. Please wait a few minutes before trying again.";
    }
    return m;
  }

  function remaining(){
    const until=Number(localStorage.getItem(RATE_KEY)||0);
    return Math.max(0,until-Date.now());
  }

  function showCooldown(){
    const ms=remaining();
    if(!ms)return;
    const seconds=Math.max(1,Math.ceil(ms/1000));
    document.querySelectorAll("button").forEach(btn=>{
      if(/continue|create account|sign up|register/i.test((btn.textContent||"").trim())){
        btn.disabled=true;
        btn.dataset.duarteRateDisabled="1";
        btn.style.opacity=".65";
        btn.style.cursor="not-allowed";
        const original=btn.dataset.duarteOriginalText||(btn.dataset.duarteOriginalText=(btn.textContent||"Continue").trim());
        btn.textContent=`Wait ${seconds}s`;
      }
    });
  }

  function restoreButtons(){
    document.querySelectorAll('button[data-duarte-rate-disabled="1"]').forEach(btn=>{
      btn.disabled=false;
      btn.style.opacity="";
      btn.style.cursor="";
      btn.textContent=btn.dataset.duarteOriginalText||"Continue";
      delete btn.dataset.duarteRateDisabled;
    });
  }

  const timer=setInterval(()=>{
    if(remaining())showCooldown(); else restoreButtons();
  },1000);

  function install(){
    const client=window.supabaseClient;
    if(!client?.auth?.signUp || client.auth.signUp.__duarteRateGuard)return false;
    const original=client.auth.signUp.bind(client.auth);
    let inFlight=false;

    async function guardedSignUp(args){
      if(remaining()){
        const error=new Error("Too many signup attempts. Please wait a few minutes before trying again.");
        error.status=429;
        return {data:{user:null,session:null},error};
      }
      if(inFlight){
        const error=new Error("Signup is already being processed. Please wait.");
        error.status=429;
        return {data:{user:null,session:null},error};
      }
      inFlight=true;
      showCooldown();
      try{
        const result=await original(args);
        if(result?.error && /rate limit|too many requests|429/i.test(String(result.error.message||result.error))){
          localStorage.setItem(RATE_KEY,String(Date.now()+COOLDOWN_MS));
          result.error.message=friendlySignupError(result.error.message);
          showCooldown();
        }
        return result;
      }finally{
        inFlight=false;
        if(!remaining())restoreButtons();
      }
    }
    guardedSignUp.__duarteRateGuard=true;
    client.auth.signUp=guardedSignUp;
    return true;
  }

  // Client is created by the existing login page. Install without changing its auth flow.
  if(!install()){
    const id=setInterval(()=>{if(install())clearInterval(id)},100);
    setTimeout(()=>clearInterval(id),10000);
  }

  // Replace any raw rate-limit text already rendered by the existing page.
  new MutationObserver(()=>{
    document.querySelectorAll("body *").forEach(el=>{
      if(el.children.length===0 && /email rate limit exceeded/i.test(el.textContent||"")){
        el.textContent="Too many signup attempts. Please wait a few minutes before trying again.";
      }
    });
  }).observe(document.body,{childList:true,subtree:true,characterData:true});

  if(remaining())showCooldown();
})();
</script>
